<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header_right">
        <h1>Bienvenue Rafaël</h1>
        <div class="champ_header">
            <label for="recherche" method="HOST"></label>
            <input aria-label="barre de recherche" type="text" name="recherche" id="recherche" placeholder="Recherche">
            <a aria-label="logo cliquable d'une personne symbolisant l'espace compte" href="#"><img id="logo_compte" src="./images/logo_compte.png"></a>
        </div>
    </header>

    <div class="header_left">
        <div class="logo">
            <img src="./images/logo_arcance.png" alt="logo d'arcance">
            <h2>ARCANCE</h2>
        </div>
        <button aria-label="logo inférieur à, pour réduire la taille de la barre de navigation"><img src="./images/logo_reduire.png"></button>
    </div>

    <div class="header_responsive">
        <a aria-label="logo d'un menu en forme de burger" href="#"><img id="logo_burger" src="./images/logo_burger.png"></a>
        <img src="./images/logo_arcance.png" alt="logo d'arcance">
        <a aria-label="logo cliquable d'une personne symbolisant l'espace compte" href="#"><img id="logo_compte_responsive" src="./images/logo_compte_blanc.png"></a>
    </div>

    <nav>    
        <button aria-label="Bouton permettant d'uploader des documents"><img src="./images/logo_plus.png">Ajouter un élément</button>
        <div class="sous_nav" id="bouton_accueil">
            <a aria-label="bouton pour aller à l'acceuil" href="#"><img src="./images/logo_accueil.png">Accueil</a>
        </div>
        <div class="sous_nav">
            <a aria-label="bouton pour aller aux coffres" href="#"><img id="coffres" src="./images/logo_coffres.png">Coffres</a>
        </div>
        <div class="sous_nav">
            <a aria-label="bouton pour aller aux offres"  href="#"><img src="./images/logo_offres.png">Offres</a>
        </div>
        <div class="sous_nav">
            <a aria-label="bouton pour aller à la corbeille"  href="#"><img src="./images/logo_corbeille.png">Corbeille</a>
        </div>
        <div class="sous_nav">
            <a aria-label="bouton pour aller à la page aide"  href="#"><img id="aide" src="./images/logo_aide.png">Aide</a>
        </div>
    </nav>
    
    <main>
        <div class="recents">
            <h3>Récents</h3>
            <div>
                <p>Trier</p>
                <button aria-label="logo de 4 carrés symbolant l'action de trier"><img src="./images/logo_trier.png"></button>
            </div>
        </div>
        <a aria-label="document cliquable" href="./assets/lorem_pdf.pdf"><div><img class="pdf" src="./images/logo_pdf.png">RIB</div><button aria-label="logo de 3 points cliquable pour afficher des options"><img src="./images/logo_points.png"></button></a>
        <a aria-label="document cliquable" href="./assets/lorem_pdf.pdf"><div><img class="pdf" src="./images/logo_pdf.png">Relevés de notes 2024</div><button aria-label="logo de 3 points cliquable pour afficher des options"><img src="./images/logo_points.png"></button></a>

        <div class="justificatifs">
            <h3>Justificatifs</h3>
            <div class="grand_filtre">
            <div class="filtre">
                <p>Filtrer</p>
                <button aria-label="logo d'un entonnoir cliquable symbolisant l'action de trier"><img src="./images/logo_filtrer.png"></button>
            </div>
            <div>
                <p>Trier</p>
                <button><img src="./images/logo_trier.png" alt="logo de 4 carrés symbolant l'action de trier"></button>
            </div>
            </div>
        </div>
        <a aria-label="document cliquable" href="./assets/lorem_pdf.pdf"><div><img class="pdf" src="./images/logo_pdf.png">Bulletin de salaire - Mars 2026</div><button aria-label="logo de 3 points cliquable pour afficher des options"><img src="./images/logo_points.png"></button></a>
        <a aria-label="document cliquable" href="./assets/lorem_pdf.pdf"><div><img class="pdf" src="./images/logo_pdf.png">Carte nationale d'identité</div><button aria-label="logo de 3 points cliquable pour afficher des options"><img src="./images/logo_points.png"></button></a>
        <a aria-label="document cliquable" href="./assets/lorem_pdf.pdf"><div><img class="pdf" src="./images/logo_pdf.png">Contrat de location</div><button aria-label="logo de 3 points cliquable pour afficher des options"><img src="./images/logo_points.png"></button></a>

        <div class="ajouter_responsive">
            <button><img src="./images/logo_ajouter.png" alt=""></button>
        </div>

        <div class="violetBar">
            <div></div>
        </div>

    </main>

    <footer>
        <div class="sous_footer">
            <a aria-label="bouton pour ouvrir la rubrique légal" href="#"><img src="./images/logo_legal.png">Légal</a>
        </div>
        <button aria-label="logo supérieur à, pour ouvrir la rubrique légal"><img src="./images/logo_augmenter.png"></button>
    </footer>

</body>
</html>
